name: test

# The sanitizer and the theme classifier are both pure functions over inputs the
# repository already holds, so they need no database, no API keys and no market
# session. Everything else here does, which is why nothing else runs in CI.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
